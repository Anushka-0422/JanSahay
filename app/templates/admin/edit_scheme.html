<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Government Scheme | JanSahay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 750px;">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Government Scheme</h4>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="mb-3">
                    <label class="form-label">Scheme Name</label>
                    <input type="text" name="scheme_name"
                           class="form-control"
                           value="{{ scheme.scheme_name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control" rows="3"
                              required>{{ scheme.description }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Eligibility Criteria</label>
                    <textarea name="eligibility"
                              class="form-control" rows="3">{{ scheme.eligibility or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Required Documents</label>
                    <textarea name="required_documents"
                              class="form-control" rows="3">{{ scheme.required_documents or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Official Website Link</label>
                    <input type="url" name="official_link"
                           class="form-control"
                           value="{{ scheme.official_link or '' }}">
                </div>

                <button type="submit" class="btn btn-success">
                    Update Scheme
                </button>

                <a href="{{ url_for('auth.manage_schemes') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
