<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JanSahay - Create Officer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('auth.admin_dashboard') }}">
            JanSahay
        </a>

        <span class="text-white">Admin Panel</span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-2">Create Officer Account</h3>

                    <p class="text-center text-muted">
                        Register a new Officer for JanSahay
                    </p>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">

                        <input type="hidden" name="csrf_token"
                               value="{{ csrf_token }}">

                        <div class="mb-3">
                            <label class="form-label">Officer Name</label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   placeholder="Enter officer name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter officer email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   minlength="8"
                                   placeholder="Create password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>

                            <input type="password"
                                   name="confirm_password"
                                   class="form-control"
                                   placeholder="Confirm password"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">
                            Create Officer Account
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.admin_dashboard') }}"
                           class="text-decoration-none">
                            Back to Admin Dashboard
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
