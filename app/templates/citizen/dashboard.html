<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JanSahay - Citizen Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">JanSahay</a>
        <div class="d-flex align-items-center gap-3">
    <span class="text-white">Citizen Panel</span>

    <form action="{{ url_for('auth.logout') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <button type="submit" class="btn btn-light btn-sm">
            Logout
        </button>
    </form>
</div>
    </div>
</nav>

<div class="container mt-5">

    <h2>Welcome, {{ user.full_name }}!</h2>

    <p class="text-muted">
        Welcome to your JanSahay Citizen Dashboard.
    </p>

    <div class="row mt-4">

        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Report Damage</h5>
                    <p>Report crop or property damage.</p>
                    <a href="{{ url_for('auth.report_damage') }}" class="btn btn-success">
                        Report Damage
                    </a>
                    <a href="{{ url_for('auth.my_reports') }}" class="btn btn-success">
                        View My Reports
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Government Schemes</h5>
                    <p>Explore available government schemes.</p>
                    <button class="btn btn-success" disabled>
                        Coming Soon
                    </button>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
