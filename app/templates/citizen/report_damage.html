<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Damage | JanSahay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 700px;">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Report Damage</h4>
        </div>

        <div class="card-body">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token }}">

                <div class="mb-3">
                    <label class="form-label">Damage Type *</label>
                    <select name="damage_type" class="form-select" required>
                        <option value="">Select Damage Type</option>
                        <option value="Crop Damage">Crop Damage</option>
                        <option value="House Damage">House Damage</option>
                        <option value="Property Damage">Property Damage</option>
                        <option value="Livestock Loss">Livestock Loss</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Incident Date *</label>
                    <input type="date" name="incident_date"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location *</label>
                    <input type="text" name="location"
                           class="form-control"
                           placeholder="Enter village, taluka or district"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estimated Loss (₹)</label>
                    <input type="number" name="estimated_loss"
                           class="form-control"
                           min="0" step="0.01" value="0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control" rows="4"
                              placeholder="Describe the damage..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit Report
                </button>

                <a href="{{ url_for('auth.dashboard') }}"
                   class="btn btn-secondary">
                    Back to Dashboard
                </a>

            </form>

        </div>
    </div>
</div>

</body>
</html>
